name: ql-tro

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ql_tro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ql_tro_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-ql_tro}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18 image lưu dữ liệu dưới /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Profile "full" (api + web trong container) được bổ sung ở Phase 9 cùng Dockerfile.

volumes:
  pgdata:
